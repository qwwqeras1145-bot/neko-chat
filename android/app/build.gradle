plugins {
    id "com.android.application"
}

android {
    namespace "com.nekochat"
    compileSdk 34

    defaultConfig {
        applicationId "com.nekochat"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
