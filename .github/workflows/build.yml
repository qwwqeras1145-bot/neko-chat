name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install pyinstaller

      - name: 打包 Windows exe
        run: pyinstaller --noconfirm --clean --onefile --console --name neko-chat-windows desktop/server.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: neko-chat-exe
          path: dist/neko-chat-windows.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/neko-chat-windows.exe
          generate_release_notes: true
