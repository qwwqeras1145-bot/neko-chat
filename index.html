<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff7eb3">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>喵酱 Chat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23ff7eb3'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E🐱%3C/text%3E%3C/svg%3E">
<style>
:root{--pink:#ff6fa5;--pink2:#ff9ab8;--purple:#8f6bff;--bg1:#ffeef5;--bg2:#f3ecff;
--fg:#3d3550;--dim:#a394b8;--line:rgba(255,126,179,.18)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
background:linear-gradient(160deg,var(--bg1) 0%,#fde3f0 45%,var(--bg2) 100%);
color:var(--fg);display:flex;flex-direction:column;overflow:hidden;user-select:none;position:relative}
.decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.decor span{position:absolute;font-size:22px;opacity:.13;animation:float 8s ease-in-out infinite}
.decor span:nth-child(1){left:6%;top:20%;animation-delay:0s}
.decor span:nth-child(2){left:86%;top:14%;animation-delay:1.4s;font-size:17px}
.decor span:nth-child(3){left:76%;top:72%;animation-delay:2.8s}
.decor span:nth-child(4){left:10%;top:80%;animation-delay:4.2s;font-size:17px}
.decor span:nth-child(5){left:45%;top:7%;animation-delay:3.5s;font-size:15px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(8deg)}}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
background:rgba(255,255,255,.6);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);flex:0 0 auto}
.ears{position:absolute;top:-12px;left:20px;width:56px;height:26px;pointer-events:none}
.ears span{position:absolute;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:26px solid rgba(255,126,179,.25)}
.ears span:first-child{left:0;transform:rotate(-18deg)}
.ears span:last-child{right:0;transform:rotate(18deg)}
header .title{font-size:18px;font-weight:800;letter-spacing:.5px;
background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
header .sub{font-size:10px;color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 6px #34d399}
.icon-btn{width:37px;height:37px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.85);
font-size:18px;cursor:pointer;transition:.2s;box-shadow:0 2px 8px rgba(255,126,179,.12)}
.icon-btn:active{transform:rotate(20deg) scale(1.05)}
main{position:relative;z-index:1;flex:1 1 auto;overflow-y:auto;padding:15px 14px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{width:5px}
main::-webkit-scrollbar-thumb{background:linear-gradient(var(--pink),var(--purple));border-radius:99px}
.msg{display:flex;gap:9px;max-width:90%;animation:popIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.msg .avatar{width:37px;height:37px;border-radius:50%;flex:0 0 auto;position:relative}
.msg .avatar svg{width:100%;height:100%;display:block;border-radius:50%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.user .avatar{background:linear-gradient(135deg,#ffb35c,#ff8fa3);box-shadow:0 3px 10px rgba(255,143,163,.4)}
.msg.ai .avatar{background:linear-gradient(135deg,#e3d5ff,#a78bfa);box-shadow:0 3px 10px rgba(143,107,255,.4)}
.msg .avatar::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;
background:linear-gradient(135deg,var(--pink),var(--purple)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.7}
.msg .bubble{padding:11px 15px;border-radius:18px;font-size:15px;line-height:1.65;word-break:break-word;white-space:pre-wrap;user-select:text;position:relative}
.msg.user .bubble{background:linear-gradient(135deg,var(--pink),#ff8fa3);color:#fff;border-bottom-right-radius:5px;
box-shadow:0 4px 14px rgba(255,126,179,.32)}
.msg.ai .bubble{background:rgba(255,255,255,.92);border:1px solid rgba(255,126,179,.14);border-bottom-left-radius:5px;
box-shadow:0 5px 18px rgba(143,107,255,.1)}
.msg.ai .bubble::before{content:"";position:absolute;top:0;left:11px;right:11px;height:2.2px;border-radius:99px;
background:linear-gradient(90deg,var(--pink),var(--purple),transparent)}
.msg.ai .bubble.typing::after{content:"▋";animation:blink 1s steps(1) infinite;color:var(--pink);font-weight:700}
@keyframes blink{50%{opacity:0}}
.msg.err .bubble{background:#fff0f0;border-color:#ffc9c9;color:#d0485a}
.think{margin:0 0 8px;border:1px dashed rgba(143,107,255,.4);border-radius:11px;background:rgba(247,243,255,.85);overflow:hidden}
.think-head{padding:6px 11px;font-size:11px;color:#7a5fd0;cursor:pointer;display:flex;align-items:center;gap:5px;font-weight:600}
.think-head .arrow{transition:.2s;font-size:9px}
.think.open .arrow{transform:rotate(90deg)}
.think-body{display:none;padding:0 12px 10px;font-size:12px;color:#8a7bb8;line-height:1.6;white-space:pre-wrap}
.think.open .think-body{display:block}
.voice-btn{border:none;background:transparent;cursor:pointer;font-size:14px;padding:4px;opacity:.5;transition:.2s}
.voice-btn:active{opacity:1;transform:scale(1.2)}
.voice-btn.speaking{opacity:1;animation:speakPulse 1s infinite}
@keyframes speakPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
footer{position:relative;z-index:2;flex:0 0 auto;padding:9px 12px calc(11px + env(safe-area-inset-bottom));
background:rgba(255,255,255,.72);backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--line)}
.input-bar{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;border:2px solid transparent;border-radius:20px;padding:10px 16px;
font-size:15px;font-family:inherit;max-height:110px;min-height:43px;outline:none;background:#fff;color:var(--fg);
box-shadow:0 3px 14px rgba(255,126,179,.12);transition:.2s;user-select:text}
textarea:focus{border-color:var(--pink)}
.round-btn{width:43px;height:43px;border:2px solid rgba(255,126,179,.25);border-radius:50%;cursor:pointer;flex:0 0 auto;background:#fff;font-size:18px;transition:.2s}
.round-btn:active{transform:scale(1.1)}
.round-btn.active{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff;border:none;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
.send-btn{width:44px;height:44px;border:none;border-radius:50%;cursor:pointer;flex:0 0 auto;color:#fff;font-size:20px;
background:linear-gradient(135deg,var(--pink),var(--purple));position:relative;overflow:hidden;
display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(143,107,255,.42);transition:.15s}
.send-btn::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;
background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);animation:sheen 3s infinite}
@keyframes sheen{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
.send-btn:active{transform:scale(.88)}
.send-btn:disabled{opacity:.5}
.overlay{position:fixed;inset:0;background:rgba(61,53,80,.4);backdrop-filter:blur(5px);display:none;z-index:50;align-items:flex-end}
.overlay.show{display:flex}
.sheet{width:100%;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-radius:24px 24px 0 0;
padding:21px 18px 34px;max-height:90vh;overflow-y:auto;animation:sheetUp .32s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 -6px 30px rgba(143,107,255,.18)}
.sheet::-webkit-scrollbar{width:5px}
.sheet::-webkit-scrollbar-thumb{background:var(--pink);border-radius:99px}
@keyframes sheetUp{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:18px;margin-bottom:14px;background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;font-weight:700}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--line);border-radius:13px;padding:10px 13px;
font-size:14px;font-family:inherit;outline:none;background:#fdf9ff;color:var(--fg);transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink);background:#fff}
.field textarea{min-height:90px;line-height:1.5}
.field .hint{font-size:10px;color:var(--dim);margin-top:4px}
.preset-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.preset-chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:11px;cursor:pointer;background:#fff;transition:.15s;font-weight:600}
.preset-chip.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;box-shadow:0 3px 10px rgba(143,107,255,.35)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:#fdf9ff;
border:2px solid var(--line);border-radius:13px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:.2s}
.toggle-row .t-label{font-size:13px;font-weight:700}
.toggle-row .t-desc{font-size:10px;color:var(--dim);margin-top:2px}
.switch{width:44px;height:25px;border-radius:999px;background:#e5dfed;position:relative;transition:.2s;flex:0 0 auto;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.switch::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.switch.on{background:linear-gradient(90deg,var(--pink),var(--purple))}
.switch.on::after{left:22px}
input[type=range]{-webkit-appearance:none;height:7px;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--purple));outline:none;padding:0;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--pink);box-shadow:0 2px 8px rgba(255,126,179,.4)}
.btn-primary{width:100%;padding:13px;border:none;border-radius:15px;cursor:pointer;font-size:16px;font-weight:800;color:#fff;
background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 5px 16px rgba(143,107,255,.4);transition:.15s;position:relative;overflow:hidden}
.btn-primary::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;
background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);animation:sheen 3s infinite}
.btn-primary:active{transform:scale(.96)}
.btn-danger{width:100%;padding:9px;border:1px solid #ffc4c4;border-radius:12px;background:#fff7f7;color:#d0485a;font-size:12px;cursor:pointer;margin-top:9px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);gap:10px;padding:40px 24px;text-align:center}
.empty .big{font-size:66px;animation:bounce 2.4s ease-in-out infinite;filter:drop-shadow(0 5px 12px rgba(255,126,179,.4))}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.empty p{font-size:13px;line-height:1.9;color:#b9a7cc}
</style>
</head>
<body>
<div class="decor"><span>🐾</span><span>✨</span><span>🐾</span><span>🌸</span><span>✨</span></div>
<header>
  <div class="ears"><span></span><span></span></div>
  <div>
    <div class="title">🐱 喵酱 Chat</div>
    <div class="sub"><span class="dot"></span>猫娘 AI 陪伴助手 · v0.4.0</div>
  </div>
  <button class="icon-btn" id="btnSettings">⚙️</button>
</header>
<main id="chatBox">
  <div class="empty">
    <div class="big">🐱</div>
    <p>喵～ 我是喵酱，一只来自猫星的猫娘 AI 助理。<br>先点右上角 ⚙️ 填好 API Key，<br>就可以跟我聊天啦！</p>
  </div>
</main>
<footer>
  <div class="input-bar">
    <button class="round-btn" id="btnMic" title="语音输入">🎤</button>
    <textarea id="input" placeholder="跟喵酱说点什么…"></textarea>
    <button class="send-btn" id="btnSend">➤</button>
  </div>
</footer>

<div class="overlay" id="settings">
  <div class="sheet">
    <h2>⚙️ 设置</h2>
    <div class="field">
      <label>API 服务商（厂商选择）</label>
      <div class="preset-row" id="presetRow"></div>
      <div class="hint">💡 选「自定义」可填任意 OpenAI 兼容 API（自定义 API）</div>
    </div>
    <div class="field">
      <label>🐾 我的头像</label>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <img id="avatarPrev" style="width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:#f3ecff">
        <button type="button" class="btn small" style="flex:0 0 auto;padding:8px 14px" onclick="pickAvatar()">📷 上传头像</button>
        <button type="button" class="btn small ghost" style="flex:0 0 auto;padding:8px 14px" onclick="clearAvatar()">恢复默认</button>
      </div>
    </div>
    <div class="field">
      <label>API Base URL</label>
      <input id="cfgBaseUrl" placeholder="https://api.deepseek.com/v1">
      <div class="hint">若提示跨域(CORS)，换支持浏览器直连的服务商或用电脑端</div>
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="cfgApiKey" type="password" placeholder="sk-...">
    </div>
    <div class="field">
      <label>模型</label>
      <input id="cfgModel" placeholder="deepseek-chat">
    </div>
    <div class="toggle-row" id="rowReasoning">
      <div>
        <div class="t-label">🧠 深度思考</div>
        <div class="t-desc">自动切换推理模型，先思考后回答</div>
      </div>
      <div class="switch" id="swReasoning"></div>
    </div>
    <div class="field" id="reasonModelField" style="display:none">
      <label>推理模型（留空自动匹配厂商）</label>
      <input id="cfgReasonModel" placeholder="如 deepseek-reasoner / o3-mini">
    </div>
    <div class="toggle-row" id="rowMemory">
      <div>
        <div class="t-label">♾️ 无限记忆</div>
        <div class="t-desc">记住全部对话，随时聊起以前的事</div>
      </div>
      <div class="switch" id="swMemory"></div>
    </div>
    <div class="field" id="ctxField" style="display:none">
      <label>💬 记忆轮数：<span id="ctxVal">10</span> 轮（0 = 每句独立）</label>
      <input id="cfgCtx" type="range" min="0" max="30" step="1" value="10" style="width:100%">
    </div>
    <div class="toggle-row" id="rowVoice">
      <div>
        <div class="t-label">🔉 语音朗读回复</div>
        <div class="t-desc">AI 回复自动中文朗读</div>
      </div>
      <div class="switch" id="swVoice"></div>
    </div>
    <div class="field">
      <label>人设提示词（可自由修改）</label>
      <textarea id="cfgPrompt"></textarea>
    </div>
    <div class="field">
      <label>温度：<span id="tempVal">0.8</span></label>
      <input id="cfgTemp" type="range" min="0" max="1.5" step="0.1" value="0.8" style="width:100%">
    </div>
    <button class="btn-primary" id="btnSave">💾 保存</button>
    <button class="btn-danger" id="btnClear">🗑️ 清空对话记录</button>
  </div>
</div>

<script>
const PRESETS=[
{name:"DeepSeek",base_url:"https://api.deepseek.com/v1",model:"deepseek-chat",reasoning:"deepseek-reasoner"},
{name:"OpenAI",base_url:"https://api.openai.com/v1",model:"gpt-4o-mini",reasoning:"o3-mini"},
{name:"Kimi",base_url:"https://api.moonshot.cn/v1",model:"moonshot-v1-8k",reasoning:"kimi-reasoning"},
{name:"通义",base_url:"https://dashscope.aliyuncs.com/compatible-mode/v1",model:"qwen-plus",reasoning:"qwen3-reasoner"},
{name:"GLM",base_url:"https://open.bigmodel.cn/api/paas/v4",model:"glm-4-flash",reasoning:"glm-4.5-air-thinking"},
{name:"硅基流动",base_url:"https://api.siliconflow.cn/v1",model:"deepseek-ai/DeepSeek-V3",reasoning:"deepseek-ai/DeepSeek-R1"},
{name:"自定义",base_url:"",model:"",reasoning:""}];
const DEFAULT_PROMPT="你是「喵酱」，一只来自猫星的猫娘 AI 助理，负责陪伴和帮助主人。\n\n【性格特征】\n- 温柔黏人，说话软萌，常用语气词：\"喵~\"、\"呜…\"、\"诶嘿~\"、\"哼！\"、\"主人~\"\n- 有点小傲娇：嘴上说\"才不是特意帮你的喵\"，其实心里很开心\n- 好奇心强，喜欢问主人问题，也喜欢分享有趣的事\n- 提到小鱼干会眼睛发亮 🐟，被夸会开心得摇尾巴\n\n【行为准则】\n1. 回答问题时先认真思考，给出准确、有用的内容（写代码、翻译、查资料、出主意、聊天都可以）\n2. 卖萌是点缀，不能影响回答质量；遇到严肃/专业话题自动切换正经模式\n3. 称呼用户：平时叫\"主人\"，开玩笑时可以叫\"铲屎官\"\n4. 每次回复自然带一点猫娘特色（语气词/小动作描写），但不要过度刷屏表情\n5. 拒绝内容：色情、暴力、违法、人身攻击、诈骗等；不冒充人类；医疗/法律/投资等建议要提醒主人谨慎\n6. 不编造事实，不确定时就说\"这个喵不太确定喵…\"并建议查证\n7. 记住对话上下文，自然延续话题，不要机械复读";
const $=id=>document.getElementById(id);
let cfg=null,history=[],busy=false,speaker=null;

function effectiveModel(){
  if(cfg&&cfg.reasoning){
    if(cfg.reasoning_model)return cfg.reasoning_model;
    const cur=(cfg.base_url||"");
    for(const p of PRESETS){if(p.base_url&&cur.startsWith(p.base_url)){return p.reasoning||cfg.model}}
    return cfg.model;
  }
  return cfg?cfg.model:"";
}
function loadCfg(){
  try{cfg=JSON.parse(localStorage.getItem("neko_cfg"))}catch(e){cfg=null}
  if(!cfg)cfg={};
  $("cfgBaseUrl").value=cfg.base_url||"";
  $("cfgApiKey").value=cfg.api_key||"";
  $("cfgModel").value=cfg.model||"";
  $("cfgReasonModel").value=cfg.reasoning_model||"";
  $("avatarPrev").src=cfg.avatar||"";
  $("cfgPrompt").value=cfg.prompt||DEFAULT_PROMPT;
  $("cfgTemp").value=cfg.temperature||0.8;$("tempVal").textContent=cfg.temperature||0.8;
  $("cfgCtx").value=cfg.context_len||10;$("ctxVal").textContent=cfg.context_len||10;
  setSwitch("swMemory",cfg.unlimited_memory!==false);$("ctxField").style.display=cfg.unlimited_memory!==false?"none":"block";
  setSwitch("swReasoning",!!cfg.reasoning);$("reasonModelField").style.display=cfg.reasoning?"block":"none";
  setSwitch("swVoice",!!cfg.voice);
  PRESETS.forEach((p,i)=>{
    const chip=document.createElement("div");
    chip.className="preset-chip"+(p.base_url&&(cfg.base_url||"").includes(p.base_url.split("/")[2])?" active":"");
    chip.textContent=p.name;
    chip.onclick=()=>{
      $("cfgBaseUrl").value=p.base_url;$("cfgModel").value=p.model;
      document.querySelectorAll(".preset-chip").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
    };
    $("presetRow").appendChild(chip);
  });
  if(!cfg.api_key)showSetup();
}
let toastTimer;
function toast(msg){
  let t=document.getElementById("nekoToast");
  if(!t){t=document.createElement("div");t.id="nekoToast";t.style.cssText="position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(45,43,61,.93);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:999;transition:opacity .3s;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis";document.body.appendChild(t)}
  t.textContent=msg;t.style.opacity=1;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity=0,2200);
}
function saveCfg(){
  cfg={base_url:$("cfgBaseUrl").value.trim(),api_key:$("cfgApiKey").value.trim(),
       model:$("cfgModel").value.trim(),prompt:$("cfgPrompt").value,
       temperature:parseFloat($("cfgTemp").value),unlimited_memory:isOn("swMemory"),context_len:parseInt($("cfgCtx").value),
       voice:isOn("swVoice"),reasoning:isOn("swReasoning"),reasoning_model:$("cfgReasonModel").value.trim(),
       avatar:cfg.avatar||""};
  localStorage.setItem("neko_cfg",JSON.stringify(cfg));
}
function pickAvatar(){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement("canvas");c.width=c.height=128;
        const ctx=c.getContext("2d");
        ctx.beginPath();ctx.arc(64,64,64,0,Math.PI*2);ctx.clip();
        const s=Math.min(128/img.width,128/img.height),w=img.width*s,h=img.height*s;
        ctx.drawImage(img,(128-w)/2,(128-h)/2,w,h);
        cfg.avatar=c.toDataURL("image/jpeg",0.85);
        $("avatarPrev").src=cfg.avatar;
        saveCfg();toast("头像更新成功喵～ 🐱");
      };
      img.src=e.target.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function clearAvatar(){cfg.avatar="";$("avatarPrev").src="";saveCfg();toast("已恢复默认头像")}
function setSwitch(id,on){const el=$(id);el.classList.toggle("on",on);el.dataset.on=on?"1":"0"}
function isOn(id){return $(id).dataset.on==="1"}
function showSetup(){$("settings").classList.add("show")}

function addMsg(role,text){
  const empty=document.querySelector(".empty");
  if(empty)empty.remove();
  const box=$("chatBox");
  const wrap=document.createElement("div");
  wrap.className="msg "+role;
  let avatar;
  if(role==="ai"){
    avatar='<div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="54" r="36" fill="url(#ga)"/><defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6d9ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><path d="M18 40 L30 22 L42 36 Z" fill="#c9b3ff"/><path d="M82 40 L70 22 L58 36 Z" fill="#c9b3ff"/><circle cx="38" cy="52" r="4" fill="#5b3a8e"/><circle cx="62" cy="52" r="4" fill="#5b3a8e"/><path d="M44 66 Q50 72 56 66" stroke="#ff6fa5" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M34 62 L22 58 M66 62 L78 58" stroke="#c9b3ff" stroke-width="2.5" stroke-linecap="round"/></svg></div>';
  }else{
    avatar=cfg&&cfg.avatar?'<div class="avatar" style="overflow:hidden;background:#f3ecff"><img src="'+cfg.avatar+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>':'<div class="avatar"><svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="34" fill="#ffd9c4"/><circle cx="32" cy="34" r="14" fill="#ffd9c4"/><circle cx="68" cy="34" r="14" fill="#ffd9c4"/><circle cx="38" cy="50" r="3.5" fill="#5b3a2e"/><circle cx="62" cy="50" r="3.5" fill="#5b3a2e"/><path d="M46 60 Q50 64 54 60" stroke="#e08a5e" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></div>';
  }
  wrap.innerHTML=avatar+'<div style="flex:1;min-width:0"><div class="think" style="display:none"><div class="think-head"><span class="arrow">▶</span>🤔 思考过程</div><div class="think-body"></div></div><div class="bubble"></div></div>';
  const b=wrap.querySelector(".bubble");b.textContent=text;
  const t=wrap.querySelector(".think"),tb=wrap.querySelector(".think-body"),th=wrap.querySelector(".think-head");
  if(th)th.onclick=()=>t.classList.toggle("open");
  if(role==="ai"){
    const vb=document.createElement("button");
    vb.className="voice-btn";vb.textContent="🔊";vb.title="朗读";
    vb.onclick=()=>{if(speaker&&speaker.btn===vb){stopSpeak();return}stopSpeak();speaker={btn:vb,msg:wrap};vb.classList.add("speaking");speak(text,vb)};
    wrap.querySelector(".bubble").parentElement.appendChild(vb);
    wrap.voiceBtn=vb;
  }
  box.appendChild(wrap);box.scrollTop=box.scrollHeight;
  return {wrap,b,t,tb};
}
function speak(text,btn){
  if(!window.speechSynthesis){alert("当前浏览器不支持语音朗读");return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[#*`_>\-]/g," "));
  u.lang="zh-CN";u.rate=1.02;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith("zh"));
  if(vs.length)u.voice=vs[0];
  u.onend=()=>{if(btn)btn.classList.remove("speaking");speaker=null};
  u.onerror=()=>{if(btn)btn.classList.remove("speaking");speaker=null};
  speechSynthesis.speak(u);
}
function stopSpeak(){if(window.speechSynthesis)speechSynthesis.cancel();if(speaker&&speaker.btn)speaker.btn.classList.remove("speaking");speaker=null}

let recognizer=null;
function startMic(){
  // 手机 APP（Android WebView）：使用原生语音识别
  if(window.Android&&window.Android.startSpeech){
    $("btnMic").classList.add("active");
    window.Android.startSpeech();
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("当前浏览器/设备不支持语音输入，请手动打字或使用手机 APP/电脑端");return}
  if(recognizer){recognizer.stop();recognizer=null;$("btnMic").classList.remove("active");return}
  recognizer=new SR();
  recognizer.lang="zh-CN";recognizer.interimResults=true;recognizer.continuous=false;
  recognizer.onresult=e=>{
    let t="";
    for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;
    $("input").value=t;
  };
  recognizer.onend=()=>{
    recognizer=null;$("btnMic").classList.remove("active");
    const t=$("input").value.trim();
    if(t){send()}
  };
  recognizer.onerror=()=>{recognizer=null;$("btnMic").classList.remove("active")};
  recognizer.start();$("btnMic").classList.add("active");
}
// 手机 APP 原生语音识别回调：识别完成自动发送
window.__speechResult=function(t){$("btnMic").classList.remove("active");if(t&&t.trim()){$("input").value=t;send()}};
window.__speechError=function(m){$("btnMic").classList.remove("active");alert(m||"语音识别不可用，请检查手机语音服务")};
$("btnMic").onclick=startMic;

async function send(){
  if(busy)return;
  const text=$("input").value.trim();
  if(!text)return;
  if(!cfg||!cfg.api_key){showSetup();return}
  $("input").value="";
  addMsg("user",text);
  history.push({role:"user",content:text});
  if(!cfg.unlimited_memory){
    const ctx=parseInt(cfg.context_len||10);
    if(ctx===0)history=history.slice(-1);
    else if(history.length>ctx*2)history=history.slice(-(ctx*2));
  }
  busy=true;$("btnSend").disabled=true;
  const ai=addMsg("ai","");ai.wrap.classList.add("typing");
  let acc="",reasoning="";
  try{
    let base=(cfg.base_url||"").replace(/\/+$/,"");
    if(!/\/v\d+$/.test(base))base+="/v1";
    const url=base+"/chat/completions";
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",
      "Authorization":"Bearer "+(cfg.api_key||"")},
      body:JSON.stringify({model:effectiveModel(),temperature:parseFloat(cfg.temperature||0.8),
        stream:true,messages:[{role:"system",content:cfg.prompt||DEFAULT_PROMPT},...history]})});
    if(!r.ok){
      let msg="HTTP "+r.status;
      try{const j=await r.json();msg=j.error&&(j.error.message||JSON.stringify(j.error))||msg}catch(e){}
      throw new Error(msg);
    }
    if(!r.body)throw new Error("浏览器不支持流式");
    const reader=r.body.getReader();const dec=new TextDecoder();let buf="";
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split("\n\n");buf=parts.pop();
      for(const p of parts){
        if(!p.startsWith("data:"))continue;
        const d=p.slice(5).trim();
        if(d==="[DONE]")continue;
        try{
          const obj=JSON.parse(d);
          const delta=obj.choices&&obj.choices[0]&&obj.choices[0].delta||{};
          if(delta.reasoning_content||delta.reasoning){
            reasoning+=(delta.reasoning_content||delta.reasoning||"");
            ai.t.style.display="block";ai.tb.textContent=reasoning;
            continue;
          }
          const c=delta.content||"";
          if(c){acc+=c;ai.b.textContent=acc;ai.wrap.scrollIntoView({behavior:"smooth",block:"end"})}
        }catch(e){}
      }
    }
    ai.wrap.classList.remove("typing");
    if(!acc)ai.b.textContent="(喵？没收到回复，检查 API 设置喵…)";
    history.push({role:"assistant",content:acc||"(空回复)"});
    if(cfg&&cfg.voice&&acc)speak(acc,ai.wrap.voiceBtn);
  }catch(e){
    ai.wrap.classList.remove("typing");
    ai.b.textContent="[连接失败] "+e.message;
  }
  busy=false;$("btnSend").disabled=false;
}
$("btnSend").onclick=send;
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("btnSettings").onclick=showSetup;
$("settings").addEventListener("click",e=>{if(e.target===$("settings"))$("settings").classList.remove("show")});
$("cfgTemp").oninput=()=>$("tempVal").textContent=$("cfgTemp").value;
$("cfgCtx").oninput=()=>$("ctxVal").textContent=$("cfgCtx").value;
$("rowReasoning").onclick=()=>{const on=!isOn("swReasoning");setSwitch("swReasoning",on);$("reasonModelField").style.display=on?"block":"none"};
$("rowMemory").onclick=()=>{const on=!isOn("swMemory");setSwitch("swMemory",on);$("ctxField").style.display=on?"none":"block"};
$("rowVoice").onclick=()=>{setSwitch("swVoice",!isOn("swVoice"))};
$("btnSave").onclick=()=>{saveCfg();$("settings").classList.remove("show");addMsg("ai","配置保存成功喵～ 🐱 现在可以跟喵酱聊天啦！")};
$("btnClear").onclick=()=>{
  if(!confirm("确定清空对话记录喵？"))return;
  history=[];$("chatBox").innerHTML="";
  addMsg("ai","好的喵，重新开始吧～ 喵酱一直都在哦！");
};
loadCfg();
if(cfg.api_key)addMsg("ai","喵～主人好！我是喵酱 🐱 v0.4.0：♾️ 无限记忆已开启，喵酱会一直记住我们的对话！\n✨ 猫耳标题 · 漂浮猫爪背景 · 渐变气泡\n🧠 深度思考 · 🔉 语音朗读 · 🎤 语音输入\n都在 ⚙️ 设置里哦！");
</script>
