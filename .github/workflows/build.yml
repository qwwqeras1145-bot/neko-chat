name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install pyinstaller

      - name: 打包 Windows exe
        run: pyinstaller --noconfirm --clean --onefile --console --name neko-chat-windows desktop/server.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: neko-chat-exe
          path: dist/neko-chat-windows.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/neko-chat-windows.exe
            android/app/build/outputs/apk/debug/neko-chat.apk
          generate_release_notes: true

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 复制页面到 APP assets
        run: cp mobile/index.html android/app/src/main/assets/index.html

      - name: 构建 debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: 重命名 APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/neko-chat.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: neko-chat-apk
          path: android/app/build/outputs/apk/debug/neko-chat.apk

      - name: 发布 APK 到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/neko-chat.apk
          generate_release_notes: true
